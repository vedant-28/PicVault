spring:
  application:
    name: picvault
  datasource:
    url: jdbc:mysql://localhost:3306/picvault?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 1GB
      file-size-threshold: 1MB

picvault:
  minio:
    url: http://localhost:9000
    access-key: root
    secret-key: passw0rd1234
    bucket: picvault-images
  upload:
    max-files-per-request: 20
    max-file-size-mb: 50

server:
  port: 8080
