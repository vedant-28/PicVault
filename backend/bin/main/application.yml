spring:
  application:
    name: picvault
  datasource:
    url: jdbc:mysql://localhost:3306/picvault
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 1GB

picvault:
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:picvault}
    secret-key: ${MINIO_SECRET_KEY:picvault123}
    bucket: ${MINIO_BUCKET:picvault-images}
  upload:
    max-files-per-request: 20
    max-file-size-mb: 50

server:
  port: 8080
