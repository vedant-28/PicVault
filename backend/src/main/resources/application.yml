spring:
  application:
    name: picvault
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:picvault}
    username: ${DB_USER:picvault}
    password: ${DB_PASSWORD:picvault}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 1GB

picvault:
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:picvault}
    secret-key: ${MINIO_SECRET_KEY:picvault123}
    bucket: ${MINIO_BUCKET:picvault-images}
  upload:
    max-files-per-request: 20
    max-file-size-mb: 50

server:
  port: 8080
